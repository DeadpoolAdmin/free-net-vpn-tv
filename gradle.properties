# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build with Android Studio's bundled JBR 21 — NOT the system JDK 25 (AGP is not certified on 25).
# If you build from the CLI, keep this line. If you build from Android Studio, you may instead select
# the JBR as the "Gradle JDK" under Settings > Build Tools > Gradle and comment this out.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
